<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1EA"/>
      <stop offset="1" stop-color="#E9E2D6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.49468271355427273" y1="0" x2="1.0469615506024417" y2="1">
      <stop offset="0" stop-color="#eaf4f6" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#a3cfd8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#eaf4f6" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="0.5" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#111111" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- fond -->
  <rect width="600" height="760" fill="url(#bg)"/>

  <!-- cap -->
  <g filter="url(#soft)">
    <rect x="256.7180693983137" y="72" width="86.56386120337261" height="88" rx="10" fill="url(#cap)"/>
    <rect x="263.30445014204855" y="160" width="73.39109971590287" height="10" rx="4" fill="#111111"/>
  </g>

  <!-- col -->
  <rect x="267.06809628132567" y="166" width="65.86380743734873" height="52" fill="url(#glass)"/>

  <!-- corps -->
  <g filter="url(#soft)">
    <rect x="158.86326977710988" y="210" width="282.27346044578024" height="440" rx="26" fill="url(#glass)" stroke="#111111" stroke-opacity="0.12"/>
  </g>

  <!-- reflet principal qui glisse -->
  <rect x="272.6326977710987" y="234" width="30" height="380" rx="15" fill="url(#shine)"/>
  <!-- reflet secondaire opposé -->
  <rect x="314.7596123493896" y="270" width="14" height="300" rx="7" fill="#ffffff" opacity="0.18"/>

  <!-- étiquette -->
  <g opacity="0.9">
    <rect x="238" y="400" width="124" height="60" rx="4" fill="#F5F1EA" stroke="#111111" stroke-opacity="0.25"/>
    <text x="300" y="424" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#111111" text-anchor="middle">ESSENCE</text>
    <text x="300" y="448" font-family="Georgia, serif" font-size="11" letter-spacing="1.5" fill="#5e9ead" text-anchor="middle">FIGUE FIG</text>
  </g>

  <!-- reflet du liquide au sol -->
  <ellipse cx="300" cy="684" rx="155.25040324517914" ry="16" fill="#111111" opacity="0.10"/>

  
</svg>