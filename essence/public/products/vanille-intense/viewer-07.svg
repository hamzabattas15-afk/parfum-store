<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1EA"/>
      <stop offset="1" stop-color="#E9E2D6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.5" y1="0" x2="1.05" y2="1">
      <stop offset="0" stop-color="#3b2a20" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#96683f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3b2a20" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="0.5" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#111111" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- fond -->
  <rect width="600" height="760" fill="url(#bg)"/>

  <!-- cap -->
  <g filter="url(#soft)">
    <rect x="256.76" y="72" width="86.47999999999999" height="88" rx="10" fill="url(#cap)"/>
    <rect x="263.34000000000003" y="160" width="73.32" height="10" rx="4" fill="#111111"/>
  </g>

  <!-- col -->
  <rect x="267.1" y="166" width="65.8" height="52" fill="url(#glass)"/>

  <!-- corps -->
  <g filter="url(#soft)">
    <rect x="159" y="210" width="282" height="440" rx="26" fill="url(#glass)" stroke="#111111" stroke-opacity="0.12"/>
  </g>

  <!-- reflet principal qui glisse -->
  <rect x="274" y="234" width="30" height="380" rx="15" fill="url(#shine)"/>
  <!-- reflet secondaire opposé -->
  <rect x="314" y="270" width="14" height="300" rx="7" fill="#ffffff" opacity="0.18"/>

  <!-- étiquette -->
  <g opacity="0.9">
    <rect x="238" y="400" width="124" height="60" rx="4" fill="#F5F1EA" stroke="#111111" stroke-opacity="0.25"/>
    <text x="300" y="424" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#111111" text-anchor="middle">ESSENCE</text>
    <text x="300" y="448" font-family="Georgia, serif" font-size="11" letter-spacing="1.5" fill="#d9b08c" text-anchor="middle">VANILLE INTENSE</text>
  </g>

  <!-- reflet du liquide au sol -->
  <ellipse cx="300" cy="684" rx="155.10000000000002" ry="16" fill="#111111" opacity="0.10"/>

  <text x="16" y="746" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111" opacity="0.45">90°</text>
</svg>